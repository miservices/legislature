<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Executive Reorganization Orders | Michigan Legislature</title>
<link rel="icon" type="image/png" href="/legislature/legislature.png">
<link rel="stylesheet" href="../shared/header.css">
<link rel="stylesheet" href="../shared/pages.css">
</head>
<body>
<script>window.ACTIVE_NAV = "executive-reorganization-orders";</script>
<div id="site-header"></div>
<script src="../shared/header.js"></script>
<div id="app"></div>
<script type="module">
  import { mountShell } from "../shared/shell.js";
  import { startBrowser, docConfig } from "../shared/browser.js";

  mountShell({ eyebrow: "Governor", title: "Executive Reorganization Orders", sub: "Orders that reorganize state departments and agencies, and what happened to them." });

  startBrowser(docConfig({
    collection: "execReorgOrders", back: "Executive Reorganization Orders", noun: "reorganization order",
    placeholder: "Search by order number, title, or agency…",
    idOf: r => String(r.number ?? r._id),
    sort: (a, b) => String(b.number).localeCompare(String(a.number), undefined, { numeric: true }),
    num: r => `Executive Reorganization Order No. ${r.number}`,
    name: r => r.title || "",
    meta: r => r.agencies || "",
    searchKeys: ["agencies"],
    docLabel: "Open the full order",
    fields: [
      { label: "Signed", key: "signedDate", type: "date" },
      { label: "Effective", key: "effectiveDate", type: "date" },
      { label: "Agencies affected", key: "agencies" }
    ],
    filters: [
      { label: "All years", get: r => String(r.number || "").split("-")[0] },
      { label: "All statuses", get: r => r.status }
    ]
  }));
</script>
</body>
</html>
