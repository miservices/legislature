<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard | Michigan Legislature</title>
<link rel="icon" type="image/png" href="/legislature/legislature.png">
<link rel="stylesheet" href="../shared/header.css">
<link rel="stylesheet" href="../shared/pages.css">
<style>
.dash{display:grid;grid-template-columns:230px minmax(0,1fr);gap:1.5rem;align-items:start}
@media(max-width:860px){.dash{grid-template-columns:1fr}}
.dnav{background:#fff;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden}
.dnav a{display:block;padding:.6rem 1rem;font-size:13px;color:#374151;border-bottom:1px solid #f3f4f6;cursor:pointer}
.dnav a:hover{background:rgba(11,31,58,.05)}
.dnav a.on{background:#0b1f3a;color:#fff;font-weight:600}
.dnav .grp{padding:.45rem 1rem;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#9ca3af;background:#fafafa;border-bottom:1px solid #f3f4f6}
.who{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;margin-bottom:1.25rem}
.who .av{width:48px;height:48px;border-radius:50%;background:#0b1f3a;color:#fbbf24;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center;border:2px solid #fbbf24}
.who b{display:block;font-size:16px;color:#0b1f3a}
.cm-info{margin-top:.7rem;font-size:13.5px;color:#374151}
.signin-card{max-width:460px;margin:1rem auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#9ca3af;padding:.5rem .6rem;border-bottom:1px solid #e5e7eb}
.tbl td{padding:.6rem;border-bottom:1px solid #f3f4f6;vertical-align:top}
.tbl tr:hover td{background:#f9fafb}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.bar input{flex:1;min-width:180px;padding:.55rem .75rem;font:inherit;font-size:13.5px;border:1px solid #d1d5db;border-radius:6px;outline:none}
.bar h2{margin:0 auto 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.prop{border:1px solid #e5e7eb;border-radius:8px;padding:1rem 1.1rem;margin-bottom:.9rem;background:#fff}
.prop-top{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:center}
.prop h3{font-size:15px;color:#111827;margin:.3rem 0}
.prop p{font-size:13px;color:#4b5563;white-space:pre-wrap}
.prop .meta{font-size:12px;color:#9ca3af}
.prop .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end;margin-top:.8rem}
.prop .row .field{margin:0}
.prop .row input,.prop .row select{padding:.45rem .6rem;font-size:13px}
</style>
</head>
<body>
<script>window.ACTIVE_NAV = "dashboard";</script>
<div id="site-header"></div>
<script src="../shared/header.js"></script>
<div id="app"></div>
<script type="module">
import {
  auth, db, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, query, where, getDocs, serverTimestamp, writeBatch,
  PUBLIC_ROLE, ROLES, ADMIN_ROLES
} from "../shared/fb.js";
import { mountShell } from "../shared/shell.js";
import { esc, asList, fmtDate, safeUrl, isDriveUrl, natCompare, badgeClass, tsDate, COMMITTEES, docLink } from "../shared/util.js";
import { BILL_STATUSES, RES_STATUSES } from "../shared/bills-view.js";

mountShell({ eyebrow: "Legislature", title: "Dashboard", sub: "Submit proposals and manage the official record.", filters: false, card: false });
const root = document.getElementById("content");

const MIGOVT_LOGIN_URL = "https://migovt.org/login/";
const SITE_NAME = "Michigan Legislature Dashboard";

let acct = null, uid = null, signingIn = false;
const isAdmin = () => ADMIN_ROLES.includes(acct && acct.role);

/* ------------------------------------------------------------------ record schemas (admin editors) */
const SEL = { bill: BILL_STATUSES, res: RES_STATUSES };
const COLLECTIONS = {
  bills: { label: "Bills", idField: "number", cols: ["number", "title", "status"], sort: "number",
    fields: [
      { key: "number", label: "Bill number", type: "number", req: true },
      { key: "title", label: "Title", req: true },
      { key: "status", label: "Status", type: "select", options: SEL.bill, req: true },
      { key: "committee", label: "Committee", type: "select", options: COMMITTEES },
      { key: "sponsors", label: "Sponsors" },
      { key: "introducedDate", label: "Introduced", type: "date" },
      { key: "description", label: "Description", type: "textarea", full: true },
      { key: "driveUrl", label: "Introduced text (Google Drive link)", type: "url", full: true },
      { key: "substituteUrls", label: "Substitute text links", type: "list", full: true },
      { key: "enrolledUrl", label: "Enrolled text link", type: "url", full: true },
      { key: "paNumber", label: "Public Act number", type: "number" },
      { key: "amendatoryBills", label: "Amendatory bills (e.g. 594B, 973A, 12R)", type: "list" },
      { key: "history", label: "History (one entry per line)", type: "list", full: true }
    ] },
  resolutions: { label: "Resolutions", idField: "number", cols: ["number", "title", "status"], sort: "number",
    fields: [
      { key: "number", label: "Resolution number", type: "number", req: true },
      { key: "title", label: "Title", req: true },
      { key: "status", label: "Status", type: "select", options: SEL.res, req: true },
      { key: "committee", label: "Committee", type: "select", options: COMMITTEES },
      { key: "sponsors", label: "Sponsors" },
      { key: "introducedDate", label: "Introduced", type: "date" },
      { key: "description", label: "Description", type: "textarea", full: true },
      { key: "driveUrl", label: "Introduced text (Google Drive link)", type: "url", full: true },
      { key: "substituteUrls", label: "Substitute text links", type: "list", full: true },
      { key: "enrolledUrl", label: "Adopted text link", type: "url", full: true },
      { key: "history", label: "History (one entry per line)", type: "list", full: true }
    ] },
  publicActs: { label: "Public Acts", idField: "number", cols: ["number", "year", "title"], sort: "number",
    fields: [
      { key: "number", label: "Public Act number", type: "number", req: true },
      { key: "year", label: "Year", type: "number", req: true },
      { key: "title", label: "Title", req: true, full: true },
      { key: "billNumber", label: "Source bill number", type: "number" },
      { key: "status", label: "Status", type: "select", options: ["In effect", "Amended", "Repealed"] },
      { key: "signedDate", label: "Signed", type: "date" },
      { key: "effectiveDate", label: "Effective", type: "date" },
      { key: "amends", label: "MCL sections it amends (one per line, e.g. 750.32)", type: "list", full: true },
      { key: "description", label: "Summary", type: "textarea", full: true },
      { key: "text", label: "Act text", type: "textarea", rows: 8, full: true },
      { key: "driveUrl", label: "Enrolled act (Google Drive link)", type: "url", full: true }
    ] },
  mclChapters: { label: "MCL chapters", idField: "cite", cols: ["cite", "title", "kind"], sort: "cite",
    fields: [
      { key: "cite", label: "Chapter number (or constitution article number)", req: true },
      { key: "title", label: "Title", req: true },
      { key: "kind", label: "Kind", type: "select", options: ["chapter", "constitution"], req: true },
      { key: "article", label: "Article numeral (constitution only, e.g. IV)" }
    ] },
  mclSections: { label: "MCL sections", idField: "cite", cols: ["cite", "title"], sort: "cite",
    before: d => { d.chapter = String(d.cite).split(".")[0]; },
    fields: [
      { key: "cite", label: "Citation (e.g. 750.32)", req: true },
      { key: "title", label: "Title", req: true },
      { key: "text", label: "Text (indent subsections with (a), (i), 1) …)", type: "textarea", rows: 12, full: true },
      { key: "history", label: "History", type: "textarea", full: true }
    ] },
  macRules: { label: "Administrative Code", idField: "cite", cols: ["cite", "agency", "title"], sort: "cite",
    fields: [
      { key: "cite", label: "Rule number (e.g. R 408.10101)", req: true },
      { key: "agency", label: "Agency", req: true },
      { key: "title", label: "Title", req: true, full: true },
      { key: "text", label: "Text", type: "textarea", rows: 10, full: true },
      { key: "history", label: "History", type: "textarea", full: true }
    ] },
  executiveOrders: { label: "Executive Orders", idField: "number", cols: ["number", "title", "status"], sort: "number",
    fields: [
      { key: "number", label: "Order number (e.g. 2026-1)", req: true },
      { key: "title", label: "Title", req: true, full: true },
      { key: "status", label: "Status", type: "select", options: ["Active", "Rescinded", "Superseded"] },
      { key: "signedDate", label: "Signed", type: "date" },
      { key: "effectiveDate", label: "Effective", type: "date" },
      { key: "rescindedBy", label: "Rescinded / superseded by" },
      { key: "description", label: "Summary", type: "textarea", full: true },
      { key: "text", label: "Order text", type: "textarea", rows: 8, full: true },
      { key: "driveUrl", label: "Full order (Google Drive link)", type: "url", full: true }
    ] },
  execReorgOrders: { label: "Reorganization Orders", idField: "number", cols: ["number", "title", "status"], sort: "number",
    fields: [
      { key: "number", label: "Order number (e.g. 2026-1)", req: true },
      { key: "title", label: "Title", req: true, full: true },
      { key: "status", label: "Status", type: "select", options: ["Submitted", "In effect", "Disapproved", "Rescinded"] },
      { key: "agencies", label: "Agencies affected", full: true },
      { key: "signedDate", label: "Signed", type: "date" },
      { key: "effectiveDate", label: "Effective", type: "date" },
      { key: "description", label: "Summary", type: "textarea", full: true },
      { key: "text", label: "Order text", type: "textarea", rows: 8, full: true },
      { key: "driveUrl", label: "Full order (Google Drive link)", type: "url", full: true }
    ] },
  journals: { label: "Journals", idField: "number", cols: ["number", "date", "sessionType"], sort: "number",
    fields: [
      { key: "number", label: "Journal number", type: "number", req: true },
      { key: "date", label: "Session date", type: "date", req: true },
      { key: "sessionType", label: "Session type", type: "select", options: ["Regular", "Special", "Organizational"] },
      { key: "title", label: "Title (optional)", full: true },
      { key: "summary", label: "Highlights", type: "textarea", full: true },
      { key: "driveUrl", label: "Full journal (Google Drive link)", type: "url", full: true }
    ] },
  calendarEvents: { label: "Calendar", idField: null, cols: ["date", "time", "type", "title"], sort: "date",
    fields: [
      { key: "title", label: "Title", req: true, full: true },
      { key: "date", label: "Date", type: "date", req: true },
      { key: "time", label: "Start time", type: "time" },
      { key: "endTime", label: "End time", type: "time" },
      { key: "type", label: "Type", type: "select", options: ["Floor session", "Committee meeting", "Public hearing", "Other"], req: true },
      { key: "committee", label: "Committee", type: "select", options: COMMITTEES },
      { key: "location", label: "Location" },
      { key: "description", label: "Description", type: "textarea", full: true },
      { key: "agendaUrl", label: "Agenda (Google Drive link)", type: "url", full: true }
    ] }
};

/* ------------------------------------------------------------------ views */
const view = html => { root.innerHTML = html; };
const loading = msg => view(`<div class="card signin-card"><div class="skel" style="height:14px;width:60%;margin-bottom:10px"></div><p class="lead" style="margin:0">${esc(msg)}</p></div>`);

function renderSignIn(error) {
  view(`<div class="card signin-card">
    <h2>Sign in</h2>
    <p class="lead">The dashboard uses your MiGOVT account to confirm who you are. You'll go to MiGOVT to sign in, then come right back here.</p>
    ${error ? `<div class="msg err">${esc(error)}</div>` : ""}
    <button class="btn btn-primary" style="width:100%" data-act="signin">Sign in with MiGOVT</button>
    <p class="lead" style="margin:1rem 0 0;font-size:12.5px">New here? Signing in creates your account automatically.</p>
  </div>`);
}

function renderNoAccess() {
  view(`<div class="card signin-card">
    <h2>You can't access the dashboard</h2>
    <p class="lead">Your account (<strong>${esc(acct.name)}</strong>) is a ${esc(acct.role || PUBLIC_ROLE)} account. The dashboard is only for legislature staff.</p>
    <div class="msg info">If you think you should have access, contact the Clerk of the Legislature.</div>
    <button class="btn btn-outline" data-act="signout">Sign out</button>
  </div>`);
}

const initials = n => String(n || "?").split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();

function renderDash() {
  const admin = isAdmin();
  const nav = [
    ["overview", "Overview"], ["mine", "My proposals"],
    ...(admin ? [["review", "Review proposals"]] : [])
  ];
  view(`<div class="dash">
    <nav class="dnav" id="dnav">
      <div class="grp">Dashboard</div>
      ${nav.map(([k, l]) => `<a data-s="${k}">${l}</a>`).join("")}
      ${admin ? `<div class="grp">Official record</div>${Object.entries(COLLECTIONS).map(([k, c]) => `<a data-s="${k}">${esc(c.label)}</a>`).join("")}` : ""}
      <a data-act="signout" style="color:#a32d2d">Sign out</a>
    </nav>
    <div id="panel"></div>
  </div>`);
  renderPanel();
}

const panel = () => document.getElementById("panel");
const flash = (msg, type = "ok") => { const p = panel(); const old = p.querySelector(".flash"); if (old) old.remove(); p.insertAdjacentHTML("afterbegin", `<div class="msg ${type} flash">${esc(msg)}</div>`); window.scrollTo({ top: 0, behavior: "smooth" }); };

function renderPanel() {
  const s = location.hash.replace(/^#/, "") || "overview";
  document.querySelectorAll("#dnav a[data-s]").forEach(a => a.classList.toggle("on", a.dataset.s === s));
  if (s === "mine") return mine();
  if (s === "review" && isAdmin()) return review();
  if (COLLECTIONS[s] && isAdmin()) return records(s);
  return overview();
}

/* ------------------------------------------------------------------ overview */
const posBadge = p => p === "Chair" ? "b-gold" : p === "Vice Chair" ? "b-navy" : "b-gray";
function memberships() {
  return (acct.committees || []).map(c => typeof c === "string" ? { committee: c, position: "Member" } : { committee: c.committee, position: c.position || "Member" }).filter(c => c.committee);
}
function overview() {
  const cms = memberships();
  const since = tsDate(acct.createdAt);
  panel().innerHTML = `<div class="card">
    <div class="who"><div class="av">${esc(initials(acct.name))}</div>
      <div><b>${esc(acct.name)}</b><span class="badge b-gold">${esc(acct.role)}</span>${since ? `<span style="font-size:12px;color:#9ca3af;margin-left:.6rem">Account created ${esc(since.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }))}</span>` : ""}</div></div>
    <div class="field" style="max-width:420px"><label for="cmSel">Your committees</label>
      ${cms.length ? `<select id="cmSel">${cms.map((c, i) => `<option value="${i}">${esc(c.committee)}</option>`).join("")}</select>` : `<select disabled><option>No committee assignments</option></select>`}
    </div>
    <div class="cm-info" id="cmInfo"></div>
  </div>
  <div class="card"><h2>What you can do</h2>
    <p class="lead" style="margin:0">${isAdmin()
      ? "Submit your own proposals, review proposals from legislators and introduce them as bills or resolutions, and edit the official record (statutes, acts, orders, journals, and the calendar)."
      : "Submit proposed bills and resolutions by sharing a Google Drive link. The Clerk's office reviews each proposal and introduces it."}</p>
  </div>`;
  showCm();
}
function showCm() {
  const sel = document.getElementById("cmSel"), info = document.getElementById("cmInfo");
  if (!sel || !info) return;
  const c = memberships()[+sel.value];
  info.innerHTML = c ? `Position: <span class="badge ${posBadge(c.position)}">${esc(c.position)}</span> &nbsp;You are ${c.position === "Member" ? "a member" : "the " + esc(c.position)} of the ${esc(c.committee.replace(/^Committee on /, "Committee on "))}.` : "";
}

/* ------------------------------------------------------------------ my proposals */
async function mine() {
  panel().innerHTML = `<div class="card"><h2>Submit a proposal</h2>
    <p class="lead">Upload your draft to Google Drive, set sharing to “Anyone with the link can view”, then paste the link here.</p>
    <div class="grid2">
      <div class="field"><label for="p_type">Type</label><select id="p_type"><option>Bill</option><option>Resolution</option></select></div>
      <div class="field"><label for="p_com">Suggested committee</label><select id="p_com"><option value="">No preference</option>${COMMITTEES.map(c => `<option>${esc(c)}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label for="p_title">Title</label><input id="p_title" maxlength="200"></div>
    <div class="field"><label for="p_desc">Short description</label><textarea id="p_desc" rows="3" maxlength="1500"></textarea></div>
    <div class="field"><label for="p_url">Google Drive link</label><input id="p_url" type="url" placeholder="https://drive.google.com/…"></div>
    <button class="btn btn-primary" data-act="submitProposal">Submit proposal</button>
  </div>
  <div class="card"><h2>My proposals</h2><div id="mineList"><div class="skel" style="height:14px;width:50%"></div></div></div>`;
  try {
    const snap = await getDocs(query(collection(db, "proposals"), where("sponsorUid", "==", uid)));
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (tsDate(b.createdAt) || 0) - (tsDate(a.createdAt) || 0));
    document.getElementById("mineList").innerHTML = list.length ? list.map(p => propCard(p, true)).join("") : '<div class="empty-state" style="padding:1rem 0">You haven\'t submitted anything yet.</div>';
  } catch (e) { console.error(e); document.getElementById("mineList").innerHTML = '<div class="msg err">Couldn\'t load your proposals.</div>'; }
}

function propCard(p, mineView) {
  const when = tsDate(p.createdAt);
  return `<div class="prop">
    <div class="prop-top"><span><span class="badge b-navy">${esc(p.type)}</span> <span class="badge ${badgeClass(p.status)}">${esc(p.status)}${p.number ? " · No. " + esc(p.number) : ""}</span></span>
      <span class="meta">${esc(p.sponsorName || "")}${when ? " · " + esc(when.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })) : ""}</span></div>
    <h3>${esc(p.title)}</h3>
    ${p.description ? `<p>${esc(p.description)}</p>` : ""}
    <div class="meta" style="margin:.4rem 0">${p.committee ? "Suggested committee: " + esc(p.committee) : ""}</div>
    ${p.reviewNote ? `<div class="msg warn" style="margin:.5rem 0">${esc(p.reviewNote)}</div>` : ""}
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">${docLink("Open draft", p.driveUrl)}
      ${mineView && p.status === "Pending" ? `<button class="btn btn-danger btn-sm" data-act="withdraw" data-id="${esc(p.id)}">Withdraw</button>` : ""}</div>
  </div>`;
}

/* ------------------------------------------------------------------ review (admins) */
async function review() {
  panel().innerHTML = '<div class="card"><h2>Review proposals</h2><div id="rev"><div class="skel" style="height:14px;width:50%"></div></div></div>';
  try {
    const [ps, bs, rs] = await Promise.all([getDocs(collection(db, "proposals")), getDocs(collection(db, "bills")), getDocs(collection(db, "resolutions"))]);
    const next = snap => snap.docs.reduce((m, d) => Math.max(m, Number(d.data().number) || 0), 0) + 1;
    const nextNo = { Bill: next(bs), Resolution: next(rs) };
    const list = ps.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (tsDate(b.createdAt) || 0) - (tsDate(a.createdAt) || 0));
    const pending = list.filter(p => p.status === "Pending"), done = list.filter(p => p.status !== "Pending");
    document.getElementById("rev").innerHTML =
      `<p class="lead">Introducing a proposal creates the official ${"bill or resolution"} record with the next number. You can change the number or committee first.</p>` +
      (pending.length ? pending.map(p => `<div class="prop" data-id="${esc(p.id)}" data-type="${esc(p.type)}">
          ${propCard(p, false).replace(/^<div class="prop">|<\/div>$/g, "")}
          <div class="row">
            <div class="field"><label>Number</label><input type="number" class="r_num" value="${nextNo[p.type] || 1}" style="width:100px"></div>
            <div class="field"><label>Refer to committee</label><select class="r_com"><option value="">None yet</option>${COMMITTEES.map(c => `<option ${c === p.committee ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
            <button class="btn btn-primary btn-sm" data-act="introduce" data-id="${esc(p.id)}">Introduce</button>
            <div class="field"><label>Reason (if rejecting)</label><input class="r_note" placeholder="Optional" style="width:200px"></div>
            <button class="btn btn-danger btn-sm" data-act="reject" data-id="${esc(p.id)}">Reject</button>
          </div></div>`).join("") : '<div class="empty-state" style="padding:1rem 0">No pending proposals.</div>') +
      (done.length ? `<div class="section-head">Decided</div>${done.slice(0, 20).map(p => propCard(p, false)).join("")}` : "");
    window.__proposals = Object.fromEntries(list.map(p => [p.id, p]));
  } catch (e) { console.error(e); document.getElementById("rev").innerHTML = '<div class="msg err">Couldn\'t load proposals.</div>'; }
}

/* ------------------------------------------------------------------ records (admins) */
let formState = null, recCache = {};
async function records(key) {
  const cfg = COLLECTIONS[key];
  panel().innerHTML = `<div class="card"><div class="bar"><h2>${esc(cfg.label)}</h2><input id="recQ" placeholder="Filter…"><button class="btn btn-gold btn-sm" data-act="newRec" data-k="${key}">+ New</button></div><div id="recList"><div class="skel" style="height:14px;width:50%"></div></div></div>`;
  try {
    const snap = await getDocs(collection(db, key));
    recCache[key] = snap.docs.map(d => ({ _id: d.id, ...d.data() })).sort((a, b) => natCompare(b[cfg.sort], a[cfg.sort]));
    drawRecList(key);
    document.getElementById("recQ").addEventListener("input", () => drawRecList(key));
  } catch (e) { console.error(e); document.getElementById("recList").innerHTML = '<div class="msg err">Couldn\'t load records.</div>'; }
}
function drawRecList(key) {
  const cfg = COLLECTIONS[key], q = (document.getElementById("recQ").value || "").toLowerCase();
  const rows = (recCache[key] || []).filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
  const lab = k => cfg.fields.find(f => f.key === k).label.replace(/\s*\(.*\)/, "");
  document.getElementById("recList").innerHTML = rows.length
    ? `<table class="tbl"><thead><tr>${cfg.cols.map(c => `<th>${esc(lab(c))}</th>`).join("")}<th></th></tr></thead><tbody>${rows.map(r =>
        `<tr>${cfg.cols.map(c => `<td>${esc(r[c] ?? "")}</td>`).join("")}<td style="text-align:right"><button class="btn btn-outline btn-sm" data-act="editRec" data-k="${key}" data-id="${esc(r._id)}">Edit</button></td></tr>`).join("")}</tbody></table>`
    : '<div class="empty-state" style="padding:1rem 0">No records yet.</div>';
}

function fieldHtml(f, v, locked) {
  const id = "f_" + f.key, val = v ?? "";
  let el;
  if (f.type === "textarea") el = `<textarea id="${id}" rows="${f.rows || 4}">${esc(val)}</textarea>`;
  else if (f.type === "list") el = `<textarea id="${id}" rows="4" placeholder="One per line">${esc(asList(val).join("\n"))}</textarea>`;
  else if (f.type === "select") el = `<select id="${id}"><option value="">—</option>${f.options.map(o => `<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else el = `<input id="${id}" type="${f.type || "text"}" value="${esc(val)}" ${locked ? "disabled" : ""}>`;
  return `<div class="field" ${f.full ? 'style="grid-column:1/-1"' : ""}><label for="${id}">${esc(f.label)}${f.req ? " *" : ""}</label>${el}</div>`;
}
function openForm(key, item) {
  const cfg = COLLECTIONS[key];
  formState = { key, id: item ? item._id : null };
  panel().innerHTML = `<div class="card"><h2>${item ? "Edit" : "New"} — ${esc(cfg.label)}</h2><p class="lead">Fields marked * are required.</p>
    <div class="grid2">${cfg.fields.map(f => fieldHtml(f, item && item[f.key], item && f.key === cfg.idField)).join("")}</div>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.5rem">
      <button class="btn btn-primary" data-act="saveRec">Save</button>
      <button class="btn btn-outline" data-act="cancelRec">Cancel</button>
      ${item ? '<button class="btn btn-danger" data-act="deleteRec" style="margin-left:auto">Delete</button>' : ""}
    </div></div>`;
}
async function saveRec() {
  const { key, id: existing } = formState, cfg = COLLECTIONS[key], data = {}, errs = [];
  for (const f of cfg.fields) {
    const el = document.getElementById("f_" + f.key);
    let v = el.value.trim();
    if (f.req && !v) errs.push(`${f.label.replace(/\s*\(.*\)/, "")} is required.`);
    if (f.type === "number") { v = v === "" ? null : Number(v); if (v !== null && isNaN(v)) errs.push(`${f.label} must be a number.`); }
    else if (f.type === "list") v = asList(el.value).map(x => (f.key.endsWith("Urls") && !safeUrl(x)) ? (errs.push("Each substitute link must be a valid URL."), x) : x);
    else if (f.type === "url" && v && !safeUrl(v)) errs.push(`${f.label} must be a valid link.`);
    data[f.key] = v;
  }
  if (errs.length) return flash(errs[0], "err");
  if (cfg.before) cfg.before(data);
  data.updatedAt = serverTimestamp(); data.updatedBy = acct.name;
  try {
    if (cfg.idField) {
      const id = existing || String(data[cfg.idField]).trim().replace(/\//g, "-");
      if (!existing && (await getDoc(doc(db, key, id))).exists()) return flash(`A record with that ${cfg.idField} already exists. Edit it instead.`, "err");
      await setDoc(doc(db, key, id), data);
    } else if (existing) await setDoc(doc(db, key, existing), data);
    else await addDoc(collection(db, key), data);
    location.hash = key; await records(key); flash("Saved.");
  } catch (e) { console.error(e); flash("Couldn't save: " + (e.code === "permission-denied" ? "you don't have permission." : e.message), "err"); }
}

/* ------------------------------------------------------------------ actions */
const A = {
  signin() { location.href = MIGOVT_LOGIN_URL + "?redirect_uri=" + encodeURIComponent(location.href.split("?")[0].split("#")[0]) + "&site_name=" + encodeURIComponent(SITE_NAME); },
  async signout() { await signOut(auth); acct = null; uid = null; renderSignIn(); },

  async submitProposal(btn) {
    const g = id => document.getElementById(id).value.trim();
    const title = g("p_title"), url = g("p_url");
    if (!title) return flash("Enter a title.", "err");
    if (!isDriveUrl(url)) return flash("Paste a Google Drive or Google Docs link (drive.google.com or docs.google.com).", "err");
    btn.disabled = true;
    try {
      await addDoc(collection(db, "proposals"), { type: g("p_type"), title, description: g("p_desc"), committee: g("p_com"), driveUrl: url, sponsorUid: uid, sponsorName: acct.name, status: "Pending", createdAt: serverTimestamp() });
      await mine(); flash("Proposal submitted. The Clerk's office will review it.");
    } catch (e) { console.error(e); btn.disabled = false; flash("Couldn't submit: " + (e.code === "permission-denied" ? "you don't have permission." : e.message), "err"); }
  },
  async withdraw(btn) {
    if (!confirm("Withdraw this proposal?")) return;
    try { await deleteDoc(doc(db, "proposals", btn.dataset.id)); await mine(); flash("Proposal withdrawn."); }
    catch (e) { flash("Couldn't withdraw: " + e.message, "err"); }
  },

  async introduce(btn) {
    const card = btn.closest(".prop"), p = window.__proposals[btn.dataset.id], coll = p.type === "Resolution" ? "resolutions" : "bills";
    const num = Number(card.querySelector(".r_num").value), com = card.querySelector(".r_com").value;
    if (!num || num < 1) return flash("Enter a valid number.", "err");
    btn.disabled = true;
    try {
      if ((await getDoc(doc(db, coll, String(num)))).exists()) { btn.disabled = false; return flash(`${p.type} No. ${num} already exists. Pick a different number.`, "err"); }
      const today = new Date().toISOString().slice(0, 10);
      const batch = writeBatch(db);
      batch.set(doc(db, coll, String(num)), {
        number: num, title: p.title, status: com ? "In committee" : "Introduced", committee: com, sponsors: p.sponsorName || "",
        introducedDate: today, description: p.description || "", driveUrl: p.driveUrl, substituteUrls: [], enrolledUrl: "", history: [`Introduced by ${p.sponsorName || "a legislator"}`, ...(com ? [`Referred to the ${com}`] : [])],
        proposalId: p.id, updatedAt: serverTimestamp(), updatedBy: acct.name
      });
      batch.update(doc(db, "proposals", p.id), { status: "Introduced", number: num, reviewedBy: acct.name, reviewedAt: serverTimestamp() });
      await batch.commit();
      await review(); flash(`${p.type} No. ${num} introduced.`);
    } catch (e) { console.error(e); btn.disabled = false; flash("Couldn't introduce: " + e.message, "err"); }
  },
  async reject(btn) {
    const card = btn.closest(".prop"), note = card.querySelector(".r_note").value.trim();
    if (!confirm("Reject this proposal?")) return;
    try { await updateDoc(doc(db, "proposals", btn.dataset.id), { status: "Rejected", reviewNote: note, reviewedBy: acct.name, reviewedAt: serverTimestamp() }); await review(); flash("Proposal rejected."); }
    catch (e) { flash("Couldn't reject: " + e.message, "err"); }
  },

  newRec(b) { openForm(b.dataset.k, null); },
  editRec(b) { openForm(b.dataset.k, (recCache[b.dataset.k] || []).find(r => r._id === b.dataset.id)); },
  saveRec,
  cancelRec() { records(formState.key); },
  async deleteRec() {
    if (!confirm("Delete this record permanently?")) return;
    const { key, id } = formState;
    try { await deleteDoc(doc(db, key, id)); await records(key); flash("Deleted."); }
    catch (e) { flash("Couldn't delete: " + e.message, "err"); }
  }
};
root.addEventListener("click", e => {
  const nav = e.target.closest("[data-s]");
  if (nav) { location.hash = nav.dataset.s; return; }
  const b = e.target.closest("[data-act]");
  if (b && A[b.dataset.act]) A[b.dataset.act](b);
});
root.addEventListener("change", e => { if (e.target.id === "cmSel") showCm(); });
window.addEventListener("hashchange", () => { if (acct && ADMIN_ROLES.concat(["Legislator"]).includes(acct.role) && document.getElementById("panel")) renderPanel(); });

/* ------------------------------------------------------------------ MiGOVT sign-in */
async function migovtSignIn(p) {
  const pin = String(p.pin);
  const authEmail = `${pin}@mipass.legislature.migovt.org`, password = `${pin}-legislature`;
  let cred;
  try { cred = await signInWithEmailAndPassword(auth, authEmail, password); }
  catch (e) {
    if (["auth/invalid-credential", "auth/user-not-found", "auth/invalid-login-credentials"].includes(e.code)) cred = await createUserWithEmailAndPassword(auth, authEmail, password);
    else throw e;
  }
  const ref = doc(db, "accounts", cred.user.uid), snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, { name: p.name, email: p.email || "", role: PUBLIC_ROLE, dob: p.dob || null, robloxUser: p.user || null, committees: [], createdAt: serverTimestamp(), lastLogin: serverTimestamp() });
  } else {
    await updateDoc(ref, { lastLogin: serverTimestamp() });
  }
}

async function loadAccount(user) {
  uid = user.uid;
  try {
    const snap = await getDoc(doc(db, "accounts", uid));
    if (!snap.exists()) { await signOut(auth); return renderSignIn("We couldn't find your account. Please sign in with MiGOVT again."); }
    acct = snap.data();
  } catch (e) { console.error(e); return renderSignIn("Couldn't load your account. Please try again."); }
  (acct.role && acct.role !== PUBLIC_ROLE && ROLES.includes(acct.role)) ? renderDash() : renderNoAccess();
}

const qs = new URLSearchParams(location.search);
const ret = qs.get("mipass_pin") && qs.get("mipass_name")
  ? { pin: qs.get("mipass_pin"), name: qs.get("mipass_name"), dob: qs.get("mipass_dob"), user: qs.get("mipass_user"), email: qs.get("mipass_email") } : null;
if (ret) { signingIn = true; history.replaceState({}, "", location.pathname); }   // keep the PIN out of the address bar

loading(ret ? "Signing you in…" : "Checking your sign-in…");
onAuthStateChanged(auth, async user => {
  if (signingIn) return;
  user ? await loadAccount(user) : renderSignIn();
});
if (ret) {
  try { await migovtSignIn(ret); signingIn = false; await loadAccount(auth.currentUser); }
  catch (e) {
    console.error(e); signingIn = false;
    renderSignIn(e.code === "auth/email-already-in-use" ? "This MiGOVT account is already linked to a different sign-in. Contact the Clerk of the Legislature."
      : e.code === "permission-denied" || (e.message || "").includes("permissions") ? "Your account couldn't be created. Make sure the Firestore rules have been published."
      : "Sign-in failed. Please try again.");
  }
}
</script>
