<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Calendar | Michigan Legislature</title>
<link rel="icon" type="image/png" href="/legislature/legislature.png">
<link rel="stylesheet" href="../shared/header.css">
<link rel="stylesheet" href="../shared/pages.css">
<style>
.cal-head{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
.cal-head h2{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600;color:#0b1f3a;margin-right:auto}
.legend{display:flex;gap:.9rem;flex-wrap:wrap;font-size:11.5px;color:#6b7280;margin-bottom:.9rem}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:.35rem;background:var(--c)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#e5e7eb;gap:1px}
.dow{background:#0b1f3a;color:#fff;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-align:center;padding:.5rem 0}
.cell{background:#fff;min-height:104px;padding:.35rem .4rem;cursor:pointer;transition:background .1s;display:flex;flex-direction:column;gap:2px}
.cell:hover{background:#f9fafb}
.cell.blank{background:#fafafa;cursor:default}
.cell.sel{box-shadow:inset 0 0 0 2px #0b1f3a}
.dnum{font-size:12px;font-weight:600;color:#374151;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cell.today .dnum{background:#fbbf24;color:#3f2d00}
.chip{display:block;font-size:10.5px;line-height:1.3;padding:2px 5px;border-radius:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--c)}
.more{font-size:10.5px;color:#6b7280}
.t-floor{--c:#0b1f3a}.t-committee{--c:#1f5fae}.t-hearing{--c:#b45309}.t-other{--c:#6b7280}
@media(max-width:720px){.cell{min-height:64px}.chip{font-size:0;height:6px;padding:0}.dnum{font-size:11px}}
.sched h3{font-family:'Fraunces',Georgia,serif;font-size:18px;color:#0b1f3a;margin-bottom:.8rem}
.ev{border:1px solid #e5e7eb;border-left:4px solid var(--c);border-radius:6px;padding:.85rem 1rem;margin-bottom:.7rem;background:#fff}
.ev-top{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;font-size:12px;color:#6b7280}
.ev-title{font-size:15px;font-weight:600;color:#111827;margin:.15rem 0}
.ev-meta{font-size:12.5px;color:#6b7280}
.ev p{font-size:13.5px;color:#374151;margin-top:.4rem}
</style>
</head>
<body>
<script>window.ACTIVE_NAV = "calendar";</script>
<div id="site-header"></div>
<script src="../shared/header.js"></script>
<div id="app"></div>
<script type="module">
  import { db, collection, getDocs } from "../shared/fb.js";
  import { mountShell } from "../shared/shell.js";
  import { esc, fmtDate, fmtTime, docLink } from "../shared/util.js";

  mountShell({ eyebrow: "Schedule", title: "Calendar", sub: "Floor sessions, committee meetings, and public hearings.", filters: false, card: false });
  const root = document.getElementById("content");

  const TYPES = { "Floor session": "t-floor", "Committee meeting": "t-committee", "Public hearing": "t-hearing", "Other": "t-other" };
  const tcls = t => TYPES[t] || "t-other";
  const pad = n => String(n).padStart(2, "0");

  let events = [];
  try {
    events = (await getDocs(collection(db, "calendarEvents"))).docs.map(d => ({ _id: d.id, ...d.data() }));
  } catch (e) {
    console.error(e);
    root.innerHTML = '<div class="card"><div class="empty-state">The calendar couldn\'t be loaded right now. Please try again shortly.</div></div>';
    throw e;
  }
  events.sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.time || "").localeCompare(String(b.time || "")));

  const now = new Date();
  let y = now.getFullYear(), m = now.getMonth(), selected = null;
  const hm = location.hash.match(/^#(\d{4})-(\d{2})$/);
  if (hm) { y = +hm[1]; m = +hm[2] - 1; }
  const todayKey = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

  function evCard(e) {
    return `<div class="ev ${tcls(e.type)}">
      <div class="ev-top"><span>${esc(fmtDate(e.date))}${e.time ? " · " + esc(fmtTime(e.time)) + (e.endTime ? "–" + esc(fmtTime(e.endTime)) : "") : ""}</span><span>${esc(e.type || "Other")}</span></div>
      <div class="ev-title">${esc(e.title)}</div>
      <div class="ev-meta">${[e.committee, e.location].filter(Boolean).map(esc).join(" · ")}</div>
      ${e.description ? `<p>${esc(e.description)}</p>` : ""}
      ${e.agendaUrl ? `<div style="margin-top:.6rem">${docLink("Agenda", e.agendaUrl)}</div>` : ""}
    </div>`;
  }

  function render() {
    const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate(), lead = first.getDay();
    const monthKey = `${y}-${pad(m + 1)}`;
    const inMonth = events.filter(e => String(e.date).startsWith(monthKey));
    const by = {};
    inMonth.forEach(e => (by[e.date] = by[e.date] || []).push(e));

    let cells = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => `<div class="dow">${d}</div>`).join("");
    for (let i = 0; i < lead; i++) cells += '<div class="cell blank"></div>';
    for (let d = 1; d <= days; d++) {
      const key = `${monthKey}-${pad(d)}`, evs = by[key] || [];
      cells += `<div class="cell ${key === todayKey ? "today" : ""} ${key === selected ? "sel" : ""}" data-day="${key}">
        <span class="dnum">${d}</span>
        ${evs.slice(0, 3).map(e => `<span class="chip ${tcls(e.type)}">${esc(e.time ? fmtTime(e.time) + " " : "")}${esc(e.title)}</span>`).join("")}
        ${evs.length > 3 ? `<span class="more">+${evs.length - 3} more</span>` : ""}
      </div>`;
    }

    const list = selected ? events.filter(e => e.date === selected) : inMonth;
    const monthName = first.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    root.innerHTML = `
      <div class="card">
        <div class="cal-head">
          <h2>${monthName}</h2>
          <button class="btn btn-outline btn-sm" data-nav="-1">&larr; Prev</button>
          <button class="btn btn-outline btn-sm" data-nav="0">Today</button>
          <button class="btn btn-outline btn-sm" data-nav="1">Next &rarr;</button>
        </div>
        <div class="legend">${Object.entries(TYPES).map(([k, c]) => `<span class="${c}">${k}</span>`).join("")}</div>
        <div class="cal-grid">${cells}</div>
      </div>
      <div class="card sched">
        <h3>${selected ? esc(fmtDate(selected)) : "Schedule for " + monthName}</h3>
        ${selected ? '<p style="margin-bottom:.8rem"><a href="#" data-clear style="color:#0b1f3a;font-weight:600;font-size:13px">Show the whole month</a></p>' : ""}
        ${list.length ? list.map(evCard).join("") : '<div class="empty-state" style="padding:1.2rem 0">Nothing scheduled.</div>'}
      </div>`;
  }

  root.addEventListener("click", e => {
    const nav = e.target.closest("[data-nav]");
    if (nav) {
      const n = +nav.dataset.nav;
      if (n === 0) { y = now.getFullYear(); m = now.getMonth(); } else { m += n; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } }
      selected = null; history.replaceState(null, "", `#${y}-${pad(m + 1)}`); render(); return;
    }
    if (e.target.closest("[data-clear]")) { e.preventDefault(); selected = null; render(); return; }
    const cell = e.target.closest("[data-day]");
    if (cell) { selected = selected === cell.dataset.day ? null : cell.dataset.day; render(); }
  });
  render();
</script>
</body>
</html>
