<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Michigan Compiled Laws | Michigan Legislature</title>
<link rel="icon" type="image/png" href="/legislature/legislature.png">
<link rel="stylesheet" href="../shared/header.css">
<link rel="stylesheet" href="../shared/pages.css">
<style>
.crumbs-line{font-size:13px;color:#6b7280;margin-bottom:1rem}
.crumbs-line a{color:#0b1f3a;font-weight:500}
.crumbs-line a:hover{text-decoration:underline}
.index-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.1rem;gap:1rem;flex-wrap:wrap}
.index-head h2{font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:600;color:#0b1f3a}
.count-pill{font-size:12px;color:#6b7280}
.feature{display:flex;align-items:center;gap:1rem;background:linear-gradient(135deg,#0b1f3a,#15294f);color:#fff;border-radius:10px;padding:1.2rem 1.4rem;margin-bottom:1.75rem}
.feature .t{font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:600}
.feature .s{font-size:12.5px;color:rgba(255,255,255,.65)}
.feature .go{margin-left:auto;color:#fbbf24;font-weight:600;font-size:13px}
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.chapter-card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:1.1rem 1.25rem;display:flex;gap:1rem;align-items:flex-start;transition:border-color .12s,box-shadow .12s}
.chapter-card:hover{border-color:#0b1f3a;box-shadow:0 6px 18px rgba(11,31,58,.08)}
.chapter-num{flex-shrink:0;min-width:52px;height:52px;padding:0 .4rem;border-radius:6px;background:#0b1f3a;color:#fbbf24;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center}
.chapter-card-title{font-size:14px;font-weight:600;color:#111827}
.chapter-card-meta{font-size:12px;color:#9ca3af}
.banner{background:linear-gradient(135deg,#0b1f3a,#15294f);border-radius:10px;padding:1.5rem 1.75rem;margin-bottom:1.5rem;color:#fff;display:flex;align-items:center;gap:1.25rem}
.banner .n{font-family:'Fraunces',Georgia,serif;font-size:32px;font-weight:600;color:#fbbf24}
.banner h2{font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:600}
.banner p{font-size:12.5px;color:rgba(255,255,255,.65)}
.section-table{border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#fff}
.section-row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid #f3f4f6;transition:background .1s}
.section-row:last-child{border-bottom:none}
.section-row:hover{background:#f9fafb}
.sr-cite{padding:.85rem 1rem;color:#0b1f3a;font-weight:600;font-size:12.5px;border-right:1px solid #f3f4f6;background:#fafafa}
.sr-title{padding:.85rem 1.1rem;font-size:13.5px;color:#374151}
.sr-sub{font-size:11px;color:#9ca3af}
.law-layout{display:grid;grid-template-columns:1fr 240px;gap:2rem;align-items:start}
@media(max-width:860px){.law-layout{grid-template-columns:1fr}.section-row{grid-template-columns:1fr}.sr-cite{border-right:none}}
.law-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
.law-head{padding:1.5rem 2rem 1.3rem;border-bottom:1px solid #e5e7eb;background:linear-gradient(180deg,#fafbfc,#fff)}
.law-cite{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;color:#0b1f3a;background:rgba(11,31,58,.07);display:inline-block;padding:3px 8px;border-radius:4px;margin-bottom:.7rem}
.law-head h2{font-family:'Fraunces',Georgia,serif;font-size:24px;font-weight:600;line-height:1.3}
.law-body{padding:1.6rem 2rem 2rem}
.law-hist{margin:0 2rem 1.5rem;padding:1rem 1.15rem;background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;font-size:12.5px;color:#6b7280}
.law-actions{display:flex;gap:.6rem;padding:1rem 2rem;border-top:1px solid #f3f4f6}
.side-card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:1rem;overflow:hidden}
.side-head{padding:.6rem 1rem;background:#0b1f3a;color:#fff;font-size:12px;font-weight:600}
.side-link{display:block;padding:.65rem 1rem;font-size:13px;color:#374151;border-bottom:1px solid #f3f4f6}
.side-link:last-child{border-bottom:none}
.side-link:hover{background:rgba(11,31,58,.05);color:#0b1f3a}
.section-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#9ca3af;margin:1.4rem 0 .75rem}
.filter-inner .btn{white-space:nowrap}
</style>
</head>
<body>
<script>window.ACTIVE_NAV = "mcl";</script>
<div id="site-header"></div>
<script src="../shared/header.js"></script>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
  import { db, collection, getDocs } from "../shared/fb.js";
  import { mountShell } from "../shared/shell.js";
  import { esc, natCompare } from "../shared/util.js";

  mountShell({ eyebrow: "Michigan Compiled Laws", title: "Compiled Laws", sub: "Browse the full body of Michigan statutory law by chapter, or look up a section by its citation.", card: false });
  const root = document.getElementById("content");
  document.getElementById("filters").innerHTML =
    '<input id="q" type="search" placeholder="Try “750.32”, “Article V”, or “firearms”…" autocomplete="off"/><button class="btn btn-primary" id="go" type="button">Look up</button>';

  const chapters = {}, sections = {};
  let chList = [], secList = [];
  root.innerHTML = '<div class="card"><div class="skel" style="height:14px;width:40%;margin-bottom:12px"></div><div class="skel" style="height:14px;width:70%"></div></div>';
  try {
    (await getDocs(collection(db, "mclChapters"))).docs.forEach(d => { const x = d.data(); const c = String(x.cite || d.id); chapters[c] = { ...x, cite: c }; });
    (await getDocs(collection(db, "mclSections"))).docs.forEach(d => { const x = d.data(); const c = String(x.cite || d.id); sections[c] = { ...x, cite: c, chapter: String(x.chapter || c.split(".")[0]) }; });
  } catch (e) {
    console.error(e);
    root.innerHTML = '<div class="card"><div class="empty-state">The compiled laws couldn\'t be loaded right now. Please try again shortly.</div></div>';
    throw e;
  }
  chList = Object.keys(chapters).sort(natCompare);
  secList = Object.keys(sections).sort(natCompare);

  const isConst = c => chapters[c] && chapters[c].kind === "constitution";
  const roman = c => (chapters[c] && chapters[c].article) || c;
  const chTitle = c => (chapters[c] && chapters[c].title) || "";
  const secsOf = c => secList.filter(s => sections[s].chapter === c);
  const secNum = cite => { const last = cite.split(".").pop(); const n = parseInt(last, 10); return isNaN(n) ? last : String(n); };
  const label = cite => { const c = sections[cite] ? sections[cite].chapter : cite.split(".")[0]; return isConst(c) ? `Art. ${roman(c)}, § ${secNum(cite)}` : `MCL ${cite}`; };
  const indent = l => { const t = l.trim(); return /^\([a-z]\)/.test(t) ? 1 : /^\([ivxlcdm]+\)/i.test(t) ? 2 : /^\d+\)/.test(t) ? 3 : /^[a-z]\)/.test(t) ? 4 : 0; };
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

  const crumbs = parts => `<div class="crumbs-line"><a href="#">Compiled Laws</a>${parts.map(p => ` / ${p.href ? `<a href="#${p.href}">${p.label}</a>` : `<strong>${p.label}</strong>`}`).join("")}</div>`;
  const chapterCard = c => {
    const k = isConst(c);
    return `<a class="chapter-card" href="#${esc(c)}"><div class="chapter-num">${esc(k ? roman(c) : c)}</div><div><div class="chapter-card-title">${esc(k ? "Article " + roman(c) + " — " + chTitle(c) : chTitle(c) || "Untitled chapter")}</div><div class="chapter-card-meta">${plural(secsOf(c).length, "section")}</div></div></a>`;
  };
  const rowHtml = s => `<a class="section-row" href="#${esc(s)}"><span class="sr-cite mono">${esc(label(s))}</span><span class="sr-title">${esc(sections[s].title || "")}</span></a>`;
  const empty = msg => `<div class="card"><div class="empty-state">${msg}</div></div>`;

  function viewIndex() {
    const consts = chList.filter(isConst), nums = chList.filter(c => !isConst(c));
    let h = "";
    if (consts.length) h += `<a class="feature" href="#constitution"><div><div class="t">Michigan Constitution</div><div class="s">${plural(consts.length, "article")} · 1963</div></div><span class="go">Browse &rarr;</span></a>`;
    if (!nums.length) return h + empty("No chapters are available yet.");
    return h + `<div class="index-head"><h2>All chapters</h2><span class="count-pill">${plural(nums.length, "chapter")} · ${plural(secList.filter(s => !isConst(sections[s].chapter)).length, "section")}</span></div><div class="chapter-grid">${nums.map(chapterCard).join("")}</div>`;
  }

  function viewConstitution() {
    const consts = chList.filter(isConst);
    return crumbs([{ label: "Constitution" }]) +
      `<div class="banner"><div class="n">1963</div><div><h2>Michigan Constitution</h2><p>${plural(consts.length, "article")}</p></div></div>` +
      (consts.length ? `<div class="chapter-grid">${consts.map(chapterCard).join("")}</div>` : empty("No articles have been codified yet."));
  }

  function viewChapter(c) {
    if (!chapters[c]) return crumbs([{ label: "Not found" }]) + empty(`Chapter ${esc(c)} could not be found.`);
    const k = isConst(c), list = secsOf(c);
    return crumbs(k ? [{ label: "Constitution", href: "constitution" }, { label: "Article " + esc(roman(c)) }] : [{ label: "Chapter " + esc(c) }]) +
      `<div class="banner"><div class="n">${esc(k ? roman(c) : c)}</div><div><h2>${esc(k ? "Article " + roman(c) + " — " + chTitle(c) : chTitle(c))}</h2><p>${plural(list.length, "section")} codified</p></div></div>` +
      (list.length ? `<div class="section-table">${list.map(rowHtml).join("")}</div>` : empty("No sections have been codified here yet."));
  }

  function viewSection(cite) {
    const s = sections[cite];
    if (!s) return crumbs([{ label: "Not found" }]) + empty(`${esc(cite)} could not be found.`);
    const c = s.chapter, k = isConst(c), sib = secsOf(c), i = sib.indexOf(cite);
    const prev = i > 0 ? sib[i - 1] : null, next = i < sib.length - 1 ? sib[i + 1] : null;
    const body = String(s.text || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean)
      .map(l => `<div class="line" style="margin-left:${indent(l) * 25}px">${esc(l)}</div>`).join("");
    return crumbs(k ? [{ label: "Constitution", href: "constitution" }, { label: "Article " + esc(roman(c)), href: c }, { label: esc(label(cite)) }]
                    : [{ label: "Chapter " + esc(c), href: c }, { label: esc(label(cite)) }]) + `
      <div class="law-layout"><div class="law-card">
        <div class="law-head"><span class="law-cite">${esc(label(cite))}</span><h2>${esc(s.title || "")}</h2></div>
        <div class="law-body law-text">${body || '<p style="color:#9ca3af">No text is on file for this section.</p>'}</div>
        ${s.history ? `<div class="law-hist"><strong>History:</strong> ${esc(s.history)}</div>` : ""}
        <div class="law-actions"><button class="btn btn-outline btn-sm" data-print="${esc(cite)}">Print as PDF</button><button class="btn btn-outline btn-sm" data-copy="${esc(cite)}">Copy link</button></div>
      </div>
      <aside><div class="side-card"><div class="side-head">${k ? "Article " + esc(roman(c)) : "In this chapter"}</div>
        ${prev ? `<a class="side-link" href="#${esc(prev)}">&larr; ${esc(label(prev))}</a>` : ""}
        <a class="side-link" href="#${esc(c)}">All sections</a>
        ${next ? `<a class="side-link" href="#${esc(next)}">${esc(label(next))} &rarr;</a>` : ""}
      </div></aside></div>`;
  }

  function viewSearch(q) {
    const l = q.toLowerCase().trim();
    const chM = l ? chList.filter(c => (chTitle(c) + " " + (isConst(c) ? "article " + roman(c) : "")).toLowerCase().includes(l) || c === q) : [];
    const secAll = l ? secList.filter(s => (sections[s].title || "").toLowerCase().includes(l) || (sections[s].text || "").toLowerCase().includes(l) || s === q || label(s).toLowerCase().includes(l)) : [];
    const secM = secAll.slice(0, 60), total = chM.length + secAll.length;
    let h = crumbs([{ label: `Search results for “${esc(q)}”` }]) +
      `<div class="index-head"><h2>Search results</h2><span class="count-pill">${plural(total, "result")}</span></div>`;
    if (!total) return h + empty("No chapters, articles, or sections matched. Try a different keyword, or a citation like <span class='mono'>750.32</span>.");
    if (chM.length) h += `<div class="section-label">Chapters &amp; articles</div><div class="chapter-grid">${chM.map(chapterCard).join("")}</div>`;
    if (secM.length) h += `<div class="section-label">Sections</div><div class="section-table">${secM.map(rowHtml).join("")}</div>` +
      (secAll.length > 60 ? '<p style="font-size:12px;color:#9ca3af;margin-top:.75rem">Showing the first 60 matches. Try a more specific search.</p>' : "");
    return h;
  }

  function route() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ""));
    root.innerHTML = !h ? viewIndex() : h === "constitution" ? viewConstitution() : h.startsWith("search:") ? viewSearch(h.slice(7)) : h.includes(".") ? viewSection(h) : viewChapter(h);
    window.scrollTo(0, 0);
  }

  const doSearch = () => { const q = document.getElementById("q").value.trim(); if (q) location.hash = "search:" + encodeURIComponent(q); };
  document.getElementById("go").addEventListener("click", doSearch);
  document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

  root.addEventListener("click", e => {
    const cp = e.target.closest("[data-copy]");
    if (cp) { navigator.clipboard && navigator.clipboard.writeText(location.origin + location.pathname + "#" + cp.dataset.copy); const t = cp.textContent; cp.textContent = "Copied"; setTimeout(() => cp.textContent = t, 1400); return; }
    const pr = e.target.closest("[data-print]");
    if (pr) {
      const cite = pr.dataset.print, s = sections[cite];
      if (!window.jspdf || !s) return alert("PDF library not loaded");
      const doc = new window.jspdf.jsPDF(); let y = 16;
      doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.text(label(cite), 14, y); y += 8;
      doc.setFontSize(11); const tl = doc.splitTextToSize(s.title || "", 180); doc.text(tl, 14, y); y += tl.length * 6 + 4;
      doc.setFont("helvetica", "normal"); doc.setFontSize(10.5);
      doc.splitTextToSize(s.text || "", 180).forEach(l => { if (y > 280) { doc.addPage(); y = 16; } doc.text(l, 14, y); y += 5.5; });
      if (s.history) { y += 4; doc.setFont("helvetica", "italic"); doc.setFontSize(9.5); doc.splitTextToSize("History: " + s.history, 180).forEach(l => { if (y > 280) { doc.addPage(); y = 16; } doc.text(l, 14, y); y += 5; }); }
      doc.save(`MCL_${cite}.pdf`);
    }
  });

  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
